<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Importar Licitaciones</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f6f8;

            color: #000;
        }

        .contenedor {
            width: 95%;

            max-width: 1000px;

            margin: 30px auto;
        }

        .tarjeta {
            background: #fff;

            border-radius: 12px;

            padding: 28px;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.06);
        }

        h1 {
            margin-top: 0;

            font-size: 27px;
        }

        .campo {
            margin-top: 20px;
        }

        .campo label {
            display: block;

            margin-bottom: 7px;

            font-weight: 700;

            font-size: 14px;
        }

        input[type="file"] {
            width: 100%;

            padding: 10px;

            border: 1px solid #ced4da;

            border-radius: 6px;

            background: #fff;
        }

        .botones {
            margin-top: 25px;

            display: flex;

            gap: 10px;
        }

        .boton {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            height: 38px;

            padding: 0 22px;

            border: none;

            border-radius: 6px;

            background: #0d6efd;

            color: #fff;

            font-size: 13px;

            font-weight: 700;

            text-decoration: none;

            cursor: pointer;
        }

        .boton:hover {
            background: #0b5ed7;
            color: #fff;
        }

        .mensaje {
            margin-bottom: 20px;

            padding: 12px 15px;

            border-radius: 6px;

            background: #f1f3f5;

            font-weight: 600;
        }

    </style>

</head>


<body>

<div class="contenedor">

    <div class="tarjeta">

        <h1>
            Importar Licitaciones
        </h1>

        <p>
            Seleccione el Excel recibido desde B2Gov.
        </p>


        {% if messages %}

            {% for message in messages %}

                <div class="mensaje">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}


        <form
            method="post"
            enctype="multipart/form-data"
        >

            {% csrf_token %}


            <div class="campo">

                <label for="archivo">
                    Archivo Excel
                </label>

                <input
                    type="file"
                    id="archivo"
                    name="archivo"
                    accept=".xlsx,.xls"
                    required
                >

            </div>


            <div class="botones">

                <button
                    type="submit"
                    class="boton"
                >
                    IMPORTAR
                </button>


                <a
                    href="{% url 'consultar' %}"
                    class="boton"
                >
                    VOLVER
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Editar carta</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .contenedor {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        .campo {
            margin-bottom: 20px;
        }

        .campo label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .asunto {
            width: 100%;
            box-sizing: border-box;
            padding: 9px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 8px;
            background: #f1f3f5;
            border: 1px solid #ccc;
            border-bottom: none;
            border-radius: 5px 5px 0 0;
        }

        .toolbar button {
            min-width: 34px;
            height: 32px;
            border: 1px solid #bbb;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .toolbar button:hover {
            background: #e9ecef;
        }

        .toolbar select {
            height: 32px;
            border: 1px solid #bbb;
            border-radius: 4px;
            background: white;
            padding: 0 6px;
            cursor: pointer;
        }

        .editor {
            min-height: 500px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 0 0 5px 5px;
            outline: none;
            font-family: Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }

        .editor:focus {
            border-color: #888;
        }

        .acciones {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .boton {
            border: none;
            border-radius: 5px;
            padding: 10px 18px;
            cursor: pointer;
            font-size: 14px;
        }

        .guardar {
            background: #198754;
            color: white;
        }

        .vista-previa {
            background: #0d6efd;
            color: white;
        }

        .variables {
            margin-top: 20px;
            padding: 12px;
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 13px;
        }

        .variable {
            display: inline-block;
            margin-right: 12px;
            padding: 4px 7px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: monospace;
            cursor: pointer;

        }

    </style>

</head>

<body>

<div class="contenedor">

    <form
        method="POST"
        id="formCarta"
        onsubmit="guardarCarta()"
    >

        {% csrf_token %}

        <input
            type="hidden"
            name="carta"
            value="{{ plantilla.carta }}"
        >
        <input
            type="hidden"
            name="tipo_destinatario"
            value="{{ plantilla.tipo_destinatario }}"
        >

    <h1>
        Editar {{ plantilla.get_carta_display }}
    </h1>


    <!-- ================================================== -->
    <!-- ASUNTO -->
    <!-- ================================================== -->

    <div class="campo">

        <label for="asunto">
            Asunto
        </label>

        <input
            type="text"
            id="asunto"
            name="asunto"
            class="asunto"
            value="{{ plantilla.asunto|default:'' }}"
            placeholder="Escribí el asunto del mail..."
        >

    </div>


    <!-- ================================================== -->
    <!-- EDITOR -->
    <!-- ================================================== -->

    <div class="campo">

        <label>
            Contenido de la carta
        </label>


        <div class="toolbar">

            <button
                type="button"
                onclick="ejecutar('bold')"
                title="Negrita"
            >
                <strong>B</strong>
            </button>


            <button
                type="button"
                onclick="ejecutar('italic')"
                title="Cursiva"
            >
                <em>I</em>
            </button>


            <button
                type="button"
                onclick="ejecutar('underline')"
                title="Subrayado"
            >
                <u>U</u>
            </button>


            <select
                onchange="cambiarTamano(this.value)"
                title="Tamaño de letra"
            >

                <option value="">
                    Tamaño
                </option>

                <option value="2">
                    Pequeña
                </option>

                <option value="3">
                    Normal
                </option>

                <option value="4">
                    Grande
                </option>

                <option value="5">
                    Muy grande
                </option>

            </select>


            <button
                type="button"
                onclick="ejecutar('justifyLeft')"
                title="Alinear izquierda"
            >
                ☰
            </button>


            <button
                type="button"
                onclick="ejecutar('justifyCenter')"
                title="Centrar"
            >
                ≡
            </button>


            <button
                type="button"
                onclick="ejecutar('justifyRight')"
                title="Alinear derecha"
            >
                ☷
            </button>


            <button
                type="button"
                onclick="insertarEnlace()"
                title="Insertar enlace"
            >
                🔗
            </button>

        </div>


        <div
            id="editor"
            class="editor"
            contenteditable="true"
        >
            {{ plantilla.contenido_html|safe }}
        </div>

    </div>


    <!-- ================================================== -->
    <!-- VARIABLES -->
    <!-- ================================================== -->



    <div class="variables">

        <strong>
            Variables disponibles:
        </strong>

        <button
            type="button"
            class="variable"
            data-variable="&#123;&#123; nombre_pila &#125;&#125;"
            onclick="insertarVariableEditor(1, this.dataset.variable)"
        >
            &#123;&#123; nombre_pila &#125;&#125;
        </button>

        <button
            type="button"
            class="variable"
            data-variable="&#123;&#123; nombre &#125;&#125;"
            onclick="insertarVariableEditor(1, this.dataset.variable)"
        >
            &#123;&#123; nombre &#125;&#125;
        </button>

        <button
            type="button"
            class="variable"
            data-variable="&#123;&#123; organismos &#125;&#125;"
            onclick="insertarVariableEditor(1, this.dataset.variable)"
        >
            &#123;&#123; organismos &#125;&#125;
        </button>


    
    </div>


    <div
        style="
            margin-top: 20px;
            padding: 12px;
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 5px;
        "
    >

        <label
            for="empresaVistaPrevia"
            style="
                font-weight: bold;
                margin-right: 10px;
            "
        >
            Empresa para vista previa:
        </label>


        <select
            id="empresaVistaPrevia"
            onchange="cargarPlantillaEmpresa()"
            style="
                padding: 7px;
                min-width: 350px;
            "
        >
            <option value="">
                Seleccionar empresa...
            </option>

            {% for empresa in empresas %}

                <option
                    value="{{ empresa.id }}"
                    data-nombre="{{ empresa.nombre }}"
                    data-nombre-pila="{{ empresa.nombre_pila|default:'' }}"
                    data-tipo="{{ empresa.tipo_destinatario }}"
                    {% if empresa_seleccionada and empresa_seleccionada.id == empresa.id %}selected{% endif %}
                >
                    {{ empresa.nombre }}
                </option>



            {% endfor %}

        </select>

    </div>



    <!-- ================================================== -->
    <!-- BOTONES -->
    <!-- ================================================== -->

    <div class="acciones">

        <button
            type="submit"
            class="boton guardar"
        >
            💾 Guardar cambios
        </button>

        <button
            type="button"
            class="boton vista-previa"
            onclick="vistaPrevia()"
        >
            👁 Vista previa
        </button>

    </div>

    <input
        type="hidden"
        name="contenido_html"
        id="contenido_html"
    >

    </form>

</div>


<script>

    function ejecutar(comando) {

        document.execCommand(
            comando,
            false,
            null
        );

    }


    function cambiarTamano(tamano) {

        if (!tamano) {
            return;
        }

        document.execCommand(
            "fontSize",
            false,
            tamano
        );

    }


    function insertarEnlace() {

        const url = prompt(
            "Ingresá la dirección del enlace:"
        );

        if (!url) {
            return;
        }

        document.execCommand(
            "createLink",
            false,
            url
        );

    }

    function guardarCarta() {

        const contenido =
            document.getElementById(
                "editor"
            ).innerHTML;

        document.getElementById(
            "contenido_html"
        ).value = contenido;

        document.getElementById(
            "formCarta"
        ).submit();

    }

    function vistaPrevia() {

        const contenido =
            document.getElementById(
                "editor"
            ).innerHTML;

        const asunto =
            document.getElementById(
                "asunto"
            ).value;

        const selector =
            document.getElementById(
                "empresaVistaPrevia"
            );

        const opcion =
            selector.options[
                selector.selectedIndex
            ];

        if (!selector.value) {

            alert(
                "Seleccioná una empresa para la vista previa."
            );

            return;
        }

        const nombre =
            opcion.dataset.nombre || "";

        const nombrePila =
            opcion.dataset.nombrePila || "";

        const tipo =
            opcion.dataset.tipo || "empresa";


        const contenidoFinal =
            contenido
                .replace(
                    /\{\{\s*nombre\s*\}\}/g,
                    nombre
                )
                .replace(
                    /\{\{\s*nombre_pila\s*\}\}/g,
                    nombrePila
                );

        const asuntoFinal =
            asunto
                .replace(
                    /\{\{\s*nombre\s*\}\}/g,
                    nombre
                )
                .replace(
                    /\{\{\s*nombre_pila\s*\}\}/g,
                    nombrePila
                );

        const ventana =
            window.open(
                "",
                "_blank",
                "width=900,height=700"
            );

        ventana.document.write(
            "<html>" +
            "<head>" +
            "<title>Vista previa</title>" +
            "</head>" +

            "<body style='" +
            "font-family:Arial,sans-serif;" +
            "padding:40px;" +
            "max-width:800px;" +
            "margin:auto;" +
            "'>" +

            "<div style='" +
            "font-weight:bold;" +
            "margin-bottom:30px;" +
            "'>" +
            "Asunto: " +
            asuntoFinal +
            "</div>" +

            contenidoFinal +

            "</body>" +
            "</html>"
        );

        ventana.document.close();

    }



    function insertarVariable(texto) {

        document.execCommand(
            "insertText",
            false,
            texto
        );

    }



    function cargarPlantillaEmpresa() {

        const selector =
            document.getElementById(
                "empresaVistaPrevia"
            );

        const empresaId = selector.value;

        if (!empresaId) {
            return;
        }

        const url =
            "/editar-carta/"
            + "?carta={{ plantilla.carta }}"
            + "&empresa_id="
            + empresaId;

        window.location.href = url;
    }



</script>

</body>

</html>
